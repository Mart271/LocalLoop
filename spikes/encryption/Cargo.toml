[package]
name = "spike-encryption"
version = "0.0.0"
edition = "2024"
publish = false
description = "SPIKE (LL-010, D-07): encryption at rest, SQLCipher vs application-level AEAD. Throwaway; never shipped."

[workspace]

[features]
# Exactly one of these must be enabled.
option-a-sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]
option-b-app-level = ["rusqlite/bundled"]

[dependencies]
rusqlite = { version = "0.40", default-features = false }
# Evidence files are encrypted the same way in both options.
chacha20poly1305 = { version = "0.10", features = ["std"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
rand = "0.9"
tempfile = "3"
thiserror = "2"
