[package]
name = "localloop-desktop"
description = "LocalLoop desktop application: Tauri host, IPC command surface, and composition root."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "localloop_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "localloop"
path = "src/main.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["isolation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "11", features = ["no-serde-warnings"] }

[dev-dependencies]
tauri = { version = "2", features = ["isolation", "test"] }
