# CI for the current repository contents: documentation, the draft workflow schema, and diagrams.
# There is no application code yet, so there is no build or application test job.
# Rust and TypeScript jobs are added in milestone M1.0 (backlog LL-003).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check requirement IDs, traceability, links, and anchors
        run: python3 scripts/check_docs.py

  schema:
    name: Workflow schema and examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install validator
        run: python3 -m pip install -r scripts/requirements.txt
      - name: Validate schema, examples, and negative fixtures
        run: python3 scripts/validate_schemas.py

  diagrams:
    name: Mermaid diagrams render
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Mermaid CLI (pinned)
        run: npm install --no-save --no-audit --no-fund @mermaid-js/mermaid-cli@11.17.0
      - name: Render every Mermaid block
        # --no-sandbox (scripts/puppeteer-config.json) is needed on Ubuntu runners; it renders only
        # diagrams from this repository.
        run: python3 scripts/validate_mermaid.py --mmdc node_modules/.bin/mmdc --puppeteer-config scripts/puppeteer-config.json
