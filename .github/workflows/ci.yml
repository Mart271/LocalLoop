# CI for LocalLoop (LL-003). Documentation, schema, fixture, and diagram checks run on Ubuntu;
# Rust and TypeScript build, lint, test, and audit run on Windows and macOS (A-01, NFR-028).
# Actions are pinned to commit SHAs (security-architecture §13); Dependabot proposes updates.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  LOCALLOOP_STRICT_OFFLINE: "1"

jobs:
  docs:
    name: Documentation consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check requirement IDs, traceability, links, and anchors
        run: python3 scripts/check_docs.py
      - name: Requirements checklist matches the SRS
        run: python3 scripts/sync_requirements_checklist.py --check
      - name: Unit tests for the repository scripts
        run: python3 -m unittest discover -s scripts/tests -v

  schema:
    name: Workflow schema and examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install validator
        run: python3 -m pip install -r scripts/requirements.txt
      - name: Validate schema, examples, and negative fixtures
        run: python3 scripts/validate_schemas.py

  fixtures:
    name: Synthetic fixtures reproducible (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned generator dependencies
        run: python -m pip install -r tools/fixtures/requirements.txt
      - name: Regenerate F1-F6 and compare with the manifest
        run: python tools/fixtures/generate.py --check

  diagrams:
    name: Mermaid diagrams render
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Mermaid CLI (pinned)
        run: npm install --no-save --no-audit --no-fund @mermaid-js/mermaid-cli@11.17.0
      - name: Render every Mermaid block
        # --no-sandbox (scripts/puppeteer-config.json) is needed on Ubuntu runners; it renders only
        # diagrams from this repository.
        run: python3 scripts/validate_mermaid.py --mmdc node_modules/.bin/mmdc --puppeteer-config scripts/puppeteer-config.json

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install UI dependencies and build the frontend the Tauri host embeds
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter desktop build
      - name: Formatting
        run: cargo fmt --all --check
      - name: Forbidden crate dependencies (NFR-030)
        run: python scripts/check_crate_deps.py
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Generated TypeScript types are up to date (LL-005)
        shell: bash
        run: |
          pnpm gen:types
          git diff --exit-code -- packages/shared/src/generated || (echo "::error::packages/shared is stale; run pnpm gen:types and commit" && exit 1)
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny,cargo-audit
      - name: Licences, bans, sources, advisories (cargo-deny)
        run: cargo deny --locked check
      - name: Advisories (cargo-audit)
        run: cargo audit --deny warnings

  typescript:
    name: TypeScript (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (lockfile must be current)
        run: pnpm install --frozen-lockfile
      - name: Formatting
        run: pnpm exec prettier --check "apps/desktop/src/**/*.{ts,tsx,css}" "apps/desktop/*.{ts,js,json}" "packages/shared/src/**/*.ts"
      - name: Lint
        run: pnpm -r lint
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Unit tests
        run: pnpm -r test
      - name: Dependency audit
        run: pnpm audit --audit-level low

  spike-child-process:
    # Spike LL-011 measurements (not a gate). Results feed docs/development/spikes/LL-011-child-processes.md.
    name: Spike LL-011 child processes (${{ matrix.os }})
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Run lifecycle measurements
        run: cargo test --release --manifest-path spikes/child-process/Cargo.toml -- --nocapture --test-threads=1

  spike-encryption:
    # Spike LL-010 / D-07 measurements (not a gate): SQLCipher (A) vs application-level AEAD (B).
    # GitHub's Windows images include Strawberry Perl, which the vendored OpenSSL build needs.
    name: Spike LL-010 encryption ${{ matrix.option }} (${{ matrix.os }})
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        option: [option-a-sqlcipher, option-b-app-level]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build (timed)
        shell: bash
        run: |
          start=$(date +%s)
          cargo build --release --manifest-path spikes/encryption/Cargo.toml --features ${{ matrix.option }}
          echo "MEASURE build_seconds: $(( $(date +%s) - start ))"
          ls -l spikes/encryption/target/release/ | grep -i spike-encryption
      - name: Run measurements
        run: cargo run --release --manifest-path spikes/encryption/Cargo.toml --features ${{ matrix.option }}
