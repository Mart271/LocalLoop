name: Feature or requirement change
description: Propose a new capability or a change to a requirement.
title: "feat: "
labels: ["type/feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem does this solve? Who has it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Describe what LocalLoop should do, in testable terms.
    validations:
      required: true
  - type: input
    id: requirements
    attributes:
      label: Existing requirements affected
      placeholder: FR-047, NFR-020 (or "new")
  - type: input
    id: source
    attributes:
      label: Proposal section
      placeholder: P§4.2
  - type: dropdown
    id: phase
    attributes:
      label: Suggested phase
      options:
        - MVP (Phase 1)
        - Phase 2
        - Phase 3
        - Phase 4
        - Not sure
  - type: textarea
    id: safety
    attributes:
      label: Safety and privacy considerations
      description: Does this let the system act on new targets, handle untrusted content, or need approvals?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
