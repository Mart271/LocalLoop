version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - type/chore
      - area/ci
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: monthly
    labels:
      - type/chore
      - area/ci
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - type/chore
      - area/ci
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - type/chore
      - area/ui
  - package-ecosystem: pip
    directory: /tools/fixtures
    schedule:
      interval: monthly
    labels:
      - type/chore
      - area/test
